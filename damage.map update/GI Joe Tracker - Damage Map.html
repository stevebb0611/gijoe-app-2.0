<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Damage Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f3eee2; --card: #e9e2d2; --card-2: #efe9dc; --ink: #211f1a; --ink-soft: #56503f;
    --line: rgba(33,31,26,.55); --line-soft: rgba(33,31,26,.22);
    --olive: #5f6b39; --crimson: #a23a2c; --ok: #5d7d4d;
    --c-cracked: #d4a73a; --c-damaged: #c0612f; --c-broken: #9a2f24;
    --font-display: 'Oswald', sans-serif; --font-mono: 'Space Mono', monospace;
    --shadow: 3px 3px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body { color: var(--ink); font-family: var(--font-mono); font-size: 13px; line-height: 1.5; }

  .page { max-width: 1060px; margin: 0 auto; padding: 26px 24px 80px; }
  .page__head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .page__title { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .4px; }
  .page__sub { font-size: 11px; color: var(--ink-soft); letter-spacing: .3px; }
  .ident { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0 20px; border-bottom: 1.5px solid var(--line-soft); margin-bottom: 22px; }
  .ftag { font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 1px; color: #fff; background: var(--olive); padding: 4px 9px; }
  .ident__name { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .4px; }
  .ident__meta { font-size: 11px; color: var(--ink-soft); }
  .ident__copy { margin-left: auto; font-size: 11px; color: var(--ink-soft); }
  .ident__copy b { font-family: var(--font-display); color: var(--ink); }

  .grid { display: grid; grid-template-columns: 412px 1fr; gap: 26px; align-items: start; }

  .seg { display: inline-flex; border: 1.5px solid var(--ink); }
  .seg button { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .2px; padding: 6px 14px; background: var(--paper); color: var(--ink-soft); border: none; cursor: pointer; min-height: 34px; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .seg button + button { border-left: 1.5px solid var(--ink); }

  .figbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }

  /* ---- figure stage + grid ---- */
  .stage { position: relative; width: 100%; background: var(--card-2); border: 1.5px solid var(--ink); box-shadow: var(--shadow); }
  .stage__inner { position: relative; width: 100%; }
  .stage img { position: relative; display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; pointer-events: none; z-index: 2; }
  .cells { position: absolute; inset: 0; z-index: 1; display: grid; touch-action: none; }
  .cell { position: relative; }
  .cell.on { box-shadow: inset 0 0 0 0.5px rgba(33,31,26,.10); cursor: pointer; }
  .cell.on.halo { box-shadow: inset 0 0 0 0.5px rgba(33,31,26,.05); }
  .cell.on::after { content: ""; position: absolute; inset: 0; background: var(--fill, transparent); }
  .cell.f1::after { background: var(--c-cracked); }
  .cell.f2::after { background: var(--c-damaged); }
  .cell.f3::after { background: var(--c-broken); }
  /* caution-stripe fill — continuous across a zone via viewport-anchored gradient */
  .fill-stripes .cell.f1::after { background: repeating-linear-gradient(45deg, var(--c-cracked) 0 5px, rgba(0,0,0,0) 5px 10px); background-attachment: fixed; }
  .fill-stripes .cell.f2::after { background: repeating-linear-gradient(45deg, var(--c-damaged) 0 5px, rgba(0,0,0,0) 5px 10px); background-attachment: fixed; }
  .fill-stripes .cell.f3::after { background: repeating-linear-gradient(45deg, var(--c-broken) 0 5px, rgba(0,0,0,0) 5px 10px); background-attachment: fixed; }
  .mode-mark .cell.on:hover { box-shadow: inset 0 0 0 1px var(--ink); }
  .mode-zones .cell.on { cursor: crosshair; }
  .cell.zmem { opacity: .32; }
  .cell.zsel { opacity: .82; box-shadow: inset 0 0 0 1px rgba(33,31,26,.6); }
  .mode-zones .cell.on:hover { box-shadow: inset 0 0 0 1px var(--olive); }

  .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 13px; font-size: 10px; color: var(--ink-soft); }
  .legend__lab { font-family: var(--font-display); font-weight: 600; letter-spacing: .4px; font-size: 11px; }
  .legend span.k { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 14px; border: 1.5px solid var(--ink); display: inline-block; }
  .legend i.f1 { background: var(--c-cracked); }
  .legend i.f2 { background: var(--c-damaged); }
  .legend i.f3 { background: var(--c-broken); }
  .legend__hint { width: 100%; margin-top: 2px; font-size: 10px; line-height: 1.5; }
  .legend__hint b { font-family: var(--font-display); color: var(--ink); font-weight: 600; }

  .toolrow { display: flex; align-items: center; gap: 10px; margin-top: 13px; flex-wrap: wrap; }
  .minibtn { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .3px; border: 1.5px solid var(--ink); background: var(--paper); padding: 7px 11px; cursor: pointer; min-height: 32px; color: var(--ink); }
  .minibtn:hover { background: #ded6c2; }
  .minibtn:disabled { opacity: .4; cursor: default; }
  .minibtn:disabled:hover { background: var(--paper); }

  /* ---- zone editor ---- */
  .zlist { max-height: 420px; overflow-y: auto; }
  .zrow { display: flex; align-items: center; gap: 9px; padding: 7px 12px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .zrow:hover { background: rgba(33,31,26,.05); }
  .zrow.on { background: rgba(95,107,57,.14); box-shadow: inset 3px 0 0 var(--olive); }
  .zrow__sw { width: 14px; height: 14px; border: 1.5px solid var(--ink); flex: none; }
  .zrow__name { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink); background: transparent; border: 1.5px solid transparent; padding: 4px 6px; }
  .zrow__name:hover { border-color: var(--line-soft); background: var(--paper); }
  .zrow__name:focus { outline: none; border-color: var(--olive); background: var(--paper); }
  .zrow__n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); min-width: 22px; text-align: right; }
  .zrow__x { flex: none; width: 24px; height: 24px; border: 1.5px solid transparent; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 12px; line-height: 1; }
  .zrow__x:hover { border-color: var(--crimson); color: var(--crimson); }
  .zfoot { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border-top: 1.5px solid var(--line-soft); }
  .toolrow__sp { flex: 1; }
  .toolrow__hint { font-size: 10.5px; color: var(--ink-soft); }

  .panel { border: 1.5px solid var(--ink); background: var(--card); box-shadow: var(--shadow); margin-bottom: 18px; }
  .panel__hd { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--ink); color: var(--paper); font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .3px; }
  .panel__hd em { margin-left: auto; font-style: normal; font-family: var(--font-mono); font-size: 10px; opacity: .65; }

  /* condition */
  .cond { padding: 13px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .cond__grade { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; color: #fff; padding: 9px 15px; display: inline-block; }
  .cond__stats { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--ink-soft); }
  .cond__stats b { font-family: var(--font-display); color: var(--ink); font-weight: 600; }
  .cond__cap { font-family: var(--font-display); font-weight: 600; color: var(--c-broken); font-size: 11px; }

  /* severity breakdown */
  .bd { padding: 13px; display: flex; flex-direction: column; gap: 9px; }
  .bd__row { display: flex; align-items: center; gap: 10px; }
  .bd__sw { width: 16px; height: 16px; border: 1.5px solid var(--ink); flex: none; }
  .bd__lab { font-family: var(--font-display); font-weight: 600; font-size: 12px; }
  .bd__lab small { font-family: var(--font-mono); font-weight: 400; font-size: 10px; color: var(--ink-soft); margin-left: 6px; letter-spacing: .2px; }
  .bd__bar { flex: 1; height: 9px; background: var(--paper); border: 1.5px solid var(--line-soft); position: relative; }
  .bd__bar i { position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); }
  .bd__n { font-family: var(--font-display); font-weight: 700; font-size: 13px; min-width: 26px; text-align: right; }
  .bd__cov { border-top: 1.5px solid var(--line-soft); margin-top: 4px; padding-top: 11px; display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--ink-soft); }
  .bd__cov b { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--ink); }

  /* holding decision */
  .verdict { padding: 13px; }
  .verdict__row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .vchip { flex: 1; border: 1.5px solid var(--line-soft); background: var(--paper); padding: 8px 10px; }
  .vchip__k { font-size: 9.5px; letter-spacing: .5px; color: var(--ink-soft); }
  .vchip__v { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-top: 3px; }
  .vchip__v small { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); font-weight: 400; }
  .varrow { font-family: var(--font-display); color: var(--ink-soft); font-size: 18px; }
  .callout { border: 1.5px solid var(--c, var(--line)); background: var(--cb, var(--paper)); padding: 11px 13px; display: flex; gap: 10px; align-items: flex-start; }
  .callout__icon { font-family: var(--font-display); font-weight: 700; flex: none; width: 22px; height: 22px; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 13px; }
  .callout__t { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .2px; }
  .callout__d { font-size: 11px; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }

  /* grading criteria */
  .crit { padding: 13px; display: flex; flex-direction: column; gap: 13px; }
  .crit__h { font-family: var(--font-display); font-weight: 600; font-size: 10.5px; letter-spacing: .4px; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 8px; }
  .crit__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .crit__list li { display: flex; align-items: center; gap: 7px; font-size: 11px; }
  .crit__list li i { width: 14px; height: 14px; border: 1.5px solid var(--ink); flex: none; }
  .crit__list li i.f1 { background: var(--c-cracked); }
  .crit__list li i.f2 { background: var(--c-damaged); }
  .crit__list li i.f3 { background: var(--c-broken); }
  .crit__list li b { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 11px; }
  .crit__formula { font-size: 10.5px; color: var(--ink-soft); border-left: 2px solid var(--olive); padding: 2px 0 2px 9px; line-height: 1.55; }
  .crit__formula b { font-family: var(--font-display); color: var(--ink); letter-spacing: .2px; }
  .crit__scale { display: flex; flex-wrap: wrap; gap: 4px; }
  .crit__chip { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; min-width: 56px; padding: 6px 4px; border: 1.5px solid var(--ink); }
  .crit__chip span { font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: .3px; color: #fff; padding: 1px 7px; }
  .crit__chip em { font-style: normal; font-size: 9.5px; color: var(--ink-soft); }
  .crit__note { font-size: 10.5px; color: var(--ink-soft); line-height: 1.55; }
  .crit__note b { color: var(--crimson); font-family: var(--font-display); font-weight: 700; }

  .actions { display: flex; gap: 12px; }
  .btn { flex: 1; border: 1.5px solid var(--ink); background: var(--card); padding: 12px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .3px; color: var(--ink); cursor: pointer; box-shadow: var(--shadow); min-height: 44px; }
  .btn:hover { background: #ded6c2; }
  .btn:active { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--ink); }

  .modal { position: fixed; inset: 0; background: rgba(33,31,26,.5); display: grid; place-items: center; z-index: 30; padding: 20px; }
  .modal__box { width: 460px; max-width: 100%; max-height: 80vh; background: var(--paper); border: 1.5px solid var(--ink); box-shadow: 7px 7px 0 rgba(33,31,26,.4); display: flex; flex-direction: column; }
  .modal__hd { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; background: var(--ink); color: var(--paper); font-family: var(--font-display); font-weight: 600; letter-spacing: .3px; }
  .modal__hd button { background: transparent; border: none; color: var(--paper); cursor: pointer; font-size: 15px; }
  .modal__pre { margin: 0; padding: 16px; overflow: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; white-space: pre; }

  @media (max-width: 880px) {
    .grid { grid-template-columns: 1fr; gap: 22px; }
    .stage { max-width: 360px; margin: 0 auto; }
    .ident__copy { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="assets/figure-masks.js"></script>
  <script src="assets/figure-zones.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const FIG = window.FIG_MASKS || {};

    /* ===================== domain model ===================== */
    // structural severity per cell. solid excel-style fill. click cycles none->1->2->3->none.
    // level 0 = none. 1 cracked, 2 damaged, 3 broken.
    const SEV = [
      null,
      { key: 'cracked', label: 'Cracked', color: 'var(--c-cracked)', hex: '#d4a73a', weight: 1 },
      { key: 'damaged', label: 'Damaged', color: 'var(--c-damaged)', hex: '#c0612f', weight: 3 },
      { key: 'broken',  label: 'Broken',  color: 'var(--c-broken)',  hex: '#9a2f24', weight: 6, cap: 'Fair' },
    ];
    // the markup (second) layer's colour mapping — severity -> fill. saved with the layer.
    const LAYER_COLORS = Object.fromEntries(SEV.slice(1).map(s => [s.key, { label: s.label, color: s.hex, weight: s.weight, cap: s.cap || null }]));

    const GRADES = ['Poor', 'Fair', 'Good', 'Excellent', 'Mint'];
    const GRADE_COLOR = { Mint: '#5d7d4d', Excellent: '#7d8a4a', Good: '#b88a2f', Fair: '#c0612f', Poor: '#8f2f24' };
    const worseOf = (a, b) => GRADES.indexOf(a) <= GRADES.indexOf(b) ? a : b;
    // demerit = sum of zone severity weights (1/3/6) across both views.
    const fromScore = (s) => s <= 0 ? 'Mint' : s < 3 ? 'Excellent' : s < 7 ? 'Good' : s < 16 ? 'Fair' : 'Poor';

    const VIEWS = ['front', 'rear'];
    const keyFor = (gender, view) => gender + '-' + view;

    // markup layer: body mask dilated +2 cells (8-neighbour x2) so zones can reach past the outline.
    const DILATE = 2;
    const _maskCache = {};
    function activeMask(key) {
      if (_maskCache[key]) return _maskCache[key];
      const f = FIG[key];
      if (!f) return null;
      const { rows, cols, mask } = f;
      let cur = mask.map(row => row.split('').map(ch => ch === '1' ? 1 : 0));
      for (let pass = 0; pass < DILATE; pass++) {
        const nxt = cur.map(row => row.slice());
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          if (cur[r][c]) continue;
          let near = false;
          for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) {
            const rr = r + dr, cc = c + dc;
            if (rr < 0 || cc < 0 || rr >= rows || cc >= cols) continue;
            if (cur[rr][cc]) { near = true; break; }
          }
          if (near) nxt[r][c] = 1;
        }
        cur = nxt;
      }
      _maskCache[key] = cur;
      return cur;
    }
    const activeCount = (key) => { const m = activeMask(key); return m ? m.reduce((s, row) => s + row.reduce((a, v) => a + v, 0), 0) : 0; };
    const isActive = (gender, view, r, c) => {
      const m = activeMask(keyFor(gender, view));
      return !!(m && m[r] && m[r][c]);
    };
    const isBody = (gender, view, r, c) => {
      const f = FIG[keyFor(gender, view)];
      return !!(f && f.mask[r] && f.mask[r][c] === '1');
    };

    /* ===================== fleet (other copies on hand) ===================== */
    const FLEET = [{ copy: 'B', grade: 'Good' }, { copy: 'C', grade: 'Excellent' }];
    const bestOf = (grades) => grades.reduce((a, g) => GRADES.indexOf(g) > GRADES.indexOf(a) ? g : a, 'Poor');

    /* ===================== zone presets — markup layer ===================== */
    // 19 default zones, empty until you paint cells into them in Zones mode.
    // one set per gender+view — front and rear are authored independently.
    const DEFAULT_ZONE_DEFS = [
      ['head', 'Head'], ['neck', 'Neck'], ['torso', 'Torso'], ['waist', 'Waist · o-ring'], ['crotch', 'Crotch'],
      ['shoulderL', 'Left shoulder'], ['shoulderR', 'Right shoulder'],
      ['elbowL', 'Left elbow'], ['elbowR', 'Right elbow'],
      ['handL', 'Left hand'], ['handR', 'Right hand'],
      ['thighL', 'Left thigh'], ['thighR', 'Right thigh'],
      ['kneeL', 'Left knee'], ['kneeR', 'Right knee'],
      ['ankleL', 'Left ankle'], ['ankleR', 'Right ankle'],
      ['footL', 'Left foot'], ['footR', 'Right foot'],
    ];
    const makeDefaultZones = () => DEFAULT_ZONE_DEFS.map(([id, label]) => ({ id, label, cells: [] }));
    // committed layer-2 zones (assets/figure-zones.js) seed the editor when there's no saved copy.
    const FIG_ZONES = window.FIG_ZONES || null;
    // committed sets are per view ("male-rear"); fall back to the legacy per-gender key
    const seedZones = (gender, view) => {
      const src = FIG_ZONES && (FIG_ZONES[gender + '-' + view] || FIG_ZONES[gender]);
      if (src) return src.map(z => ({ ...z, cells: z.cells.slice() }));
      return makeDefaultZones();
    };
    const cloneZones = (list) => list.map(z => ({ ...z, cells: z.cells.slice() }));
    // per-view store: { 'male-front': [...], 'male-rear': [...], ... }
    const seedZoneStore = () => {
      const out = {};
      ['male', 'female'].forEach(gd => VIEWS.forEach(v => { out[keyFor(gd, v)] = seedZones(gd, v); }));
      // migrate a legacy per-gender store: the shared set becomes both views' starting point
      const old = load('dm_zones', null);
      if (old) ['male', 'female'].forEach(gd => { if (Array.isArray(old[gd])) VIEWS.forEach(v => { out[keyFor(gd, v)] = cloneZones(old[gd]); }); });
      return out;
    };
    // move every cell in a view's zones by (dr,dc); cells pushed off the active mask are dropped
    const nudgeZones = (list, gender, view, dr, dc) => {
      const m = activeMask(keyFor(gender, view));
      return list.map(z => ({ ...z, cells: z.cells.map(c => {
        const [r, cc] = c.split('-').map(Number);
        return [r + dr, cc + dc];
      }).filter(([r, cc]) => m && m[r] && m[r][cc]).map(([r, cc]) => r + '-' + cc) }));
    };
    // distinct editing tint per zone (authoring overlay only; damage uses severity colours).
    const zoneTint = (i) => 'hsl(' + ((i * 67) % 360) + ' 58% 48%)';
    const cellsToZoneMap = (zones) => { const m = {}; zones.forEach(z => z.cells.forEach(c => { m[c] = z.id; })); return m; };
    const uid = () => 'z' + Math.random().toString(36).slice(2, 8);
    const load = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } };

    /* ===================== character (gender-driven; DB later) ===================== */
    const CHAR = {
      male:   { tag: 'JOE', name: 'Breaker', meta: 'Communications · 1982 · o-ring construction', copy: 'A' },
      female: { tag: 'JOE', name: 'Scarlett', meta: 'Counter intelligence · 1982 · o-ring construction', copy: 'A' },
    };

    /* ===================== figure grid ===================== */
    function FigureGrid({ mode, gender, view, zones, zoneOf, selZoneId, zoneDmgView, onCycleZone, onToggleCell, fillStyle }) {
      const f = FIG[keyFor(gender, view)];
      const dm = activeMask(keyFor(gender, view));
      const actionRef = useRef(null);   // 'add' | 'remove' during a zone-membership drag
      const draggingRef = useRef(false);
      if (!f) return <div className="stage" style={{ padding: 20 }}>missing art: {keyFor(gender, view)}</div>;

      const tintIdx = {}; zones.forEach((z, i) => { tintIdx[z.id] = i; });
      const tintOf = (zid) => zoneTint(tintIdx[zid] || 0);

      const onDownZones = (cell) => {
        const inSel = zoneOf[cell] === selZoneId;
        actionRef.current = inSel ? 'remove' : 'add';
        draggingRef.current = true;
        onToggleCell(cell, actionRef.current);
      };
      const onEnterZones = (cell) => {
        if (!draggingRef.current || !actionRef.current) return;
        onToggleCell(cell, actionRef.current);
      };
      const stop = () => { draggingRef.current = false; actionRef.current = null; };

      const cells = [];
      // severity at each cell for the current view (mark mode) — drives the zone-perimeter outline
      const sevMap = {};
      if (mode === 'mark') { for (const cell in zoneOf) { const lvl = zoneDmgView[zoneOf[cell]]; if (lvl) sevMap[cell] = lvl; } }
      const sevAt = (r, c) => sevMap[r + '-' + c] || 0;
      for (let r = 0; r < f.rows; r++) {
        for (let c = 0; c < f.cols; c++) {
          const active = !!(dm && dm[r][c]);
          const body = f.mask[r][c] === '1';
          const cell = r + '-' + c;
          const zid = active ? zoneOf[cell] : undefined;
          let cls = 'cell' + (active ? ' on' : '') + (active && !body ? ' halo' : '');
          let style;
          let handlers = {};
          if (active && mode === 'mark') {
            const lvl = zid ? (zoneDmgView[zid] || 0) : 0;
            if (lvl) {
              cls += ' f' + lvl;
              const bd = '1.5px solid #18160f';   // black outline on the marked-zone perimeter only
              const st = {};
              if (sevAt(r - 1, c) !== lvl) st.borderTop = bd;
              if (sevAt(r + 1, c) !== lvl) st.borderBottom = bd;
              if (sevAt(r, c - 1) !== lvl) st.borderLeft = bd;
              if (sevAt(r, c + 1) !== lvl) st.borderRight = bd;
              style = st;
            }
            if (zid) handlers = { onPointerDown: () => onCycleZone(zid) };
          } else if (active && mode === 'zones') {
            if (zid === selZoneId) { cls += ' zsel'; style = { background: tintOf(zid) }; }
            else if (zid) { cls += ' zmem'; style = { background: tintOf(zid) }; }
            handlers = { onPointerDown: () => onDownZones(cell), onPointerEnter: () => onEnterZones(cell) };
          }
          cells.push(<div key={cell} className={cls} style={style} {...handlers} />);
        }
      }
      return (
        <div className="stage">
          <div className="stage__inner" style={{ aspectRatio: f.w + ' / ' + f.h }}
               onPointerUp={stop} onPointerLeave={stop}>
            <div className={'cells mode-' + mode + (fillStyle === 'stripes' ? ' fill-stripes' : '')}
                 style={{ gridTemplateColumns: 'repeat(' + f.cols + ',1fr)', gridTemplateRows: 'repeat(' + f.rows + ',1fr)' }}>
              {cells}
            </div>
            <img src={'assets/fig/' + keyFor(gender, view) + '.png'} alt={gender + ' ' + view} />
          </div>
        </div>
      );
    }

    /* ===================== grade engine (zone-based) ===================== */
    function gradeOf(gender, zonesByView, zoneDmg) {
      let score = 0, cap = 'Mint';
      const counts = [0, 0, 0, 0];   // zones at each severity, across both views
      let filledCells = 0, activeTotal = 0;
      VIEWS.forEach(v => {
        activeTotal += activeCount(keyFor(gender, v));
        const size = {}; (zonesByView[v] || []).forEach(z => { size[z.id] = z.cells.length; });
        const dv = zoneDmg[v] || {};
        Object.entries(dv).forEach(([zid, lvl]) => {
          if (!lvl || size[zid] == null) return;
          const s = SEV[lvl];
          score += s.weight; counts[lvl]++; filledCells += size[zid];
          if (s.cap) cap = worseOf(cap, s.cap);
        });
      });
      const base = fromScore(score);
      const grade = worseOf(base, cap);
      const markedZones = counts[1] + counts[2] + counts[3];
      return { grade, score, counts, markedZones, filledCells, activeTotal,
               coverage: activeTotal ? filledCells / activeTotal : 0,
               capped: GRADES.indexOf(cap) < GRADES.indexOf(base), cap };
    }

    /* ===================== criteria ===================== */
    const GRADE_BANDS = [
      { g: 'Mint', r: '0' }, { g: 'Excellent', r: '1 – 2' }, { g: 'Good', r: '3 – 6' },
      { g: 'Fair', r: '7 – 15' }, { g: 'Poor', r: '16 +' },
    ];
    function CriteriaPanel() {
      return (
        <div className="panel">
          <div className="panel__hd">Grading criteria <em>how the map becomes a grade</em></div>
          <div className="crit">
            <div>
              <div className="crit__h">Per marked zone</div>
              <ul className="crit__list">
                <li><i className="f1"></i>Cracked<b>+1</b></li>
                <li><i className="f2"></i>Damaged<b>+3</b></li>
                <li><i className="f3"></i>Broken<b>+6</b></li>
              </ul>
            </div>
            <div className="crit__formula">
              <b>Demerit</b> = sum of each marked zone's severity weight across front &amp; rear. More zones and
              higher severity drive the grade down. Coverage % shows how much of the body the marked zones cover.
            </div>
            <div>
              <div className="crit__h">Demerit → grade</div>
              <div className="crit__scale">
                {GRADE_BANDS.map(b => <div key={b.g} className="crit__chip"><span style={{ background: GRADE_COLOR[b.g] }}>{b.g}</span><em>{b.r}</em></div>)}
              </div>
            </div>
            <div className="crit__note">
              Any <b>Broken</b> zone caps the ceiling at <b>Fair</b> no matter the total.
            </div>
          </div>
        </div>
      );
    }

    /* ===================== zone editor ===================== */
    function ZoneEditor({ zones, view, selZoneId, onSelect, onAdd, onRename, onDelete, onClearCells, onResetZones, onNudge, onCopyFrom }) {
      const other = view === 'front' ? 'rear' : 'front';
      return (
        <div className="panel">
          <div className="panel__hd">Zone presets <em>{zones.length} zones · {view} only</em></div>
          <div className="zlist">
            {zones.map((z, i) => (
              <div key={z.id} className={'zrow' + (z.id === selZoneId ? ' on' : '')} onClick={() => onSelect(z.id)}>
                <span className="zrow__sw" style={{ background: zoneTint(i) }}></span>
                <input className="zrow__name" value={z.label}
                       onChange={e => onRename(z.id, e.target.value)} onClick={e => e.stopPropagation()} />
                <span className="zrow__n" title="cells in this zone">{z.cells.length}</span>
                <button className="zrow__x" title="delete zone" onClick={e => { e.stopPropagation(); onDelete(z.id); }}>✕</button>
              </div>
            ))}
          </div>
          <div className="zfoot">
            <button className="minibtn" onClick={() => onNudge(-1, 0)} title="Shift every zone up one row">↑</button>
            <button className="minibtn" onClick={() => onNudge(1, 0)} title="Shift every zone down one row">↓</button>
            <button className="minibtn" onClick={() => onNudge(0, -1)} title="Shift every zone left one column">←</button>
            <button className="minibtn" onClick={() => onNudge(0, 1)} title="Shift every zone right one column">→</button>
            <div className="toolrow__sp"></div>
            <button className="minibtn" onClick={onCopyFrom} title={'Replace this view\u2019s zones with the ' + other + ' set'}>Copy from {other}</button>
          </div>
          <div className="zfoot">
            <button className="minibtn" onClick={onAdd}>+ Add zone</button>
            <button className="minibtn" onClick={() => onClearCells(selZoneId)} disabled={!selZoneId}>Clear cells</button>
            <div className="toolrow__sp"></div>
            <button className="minibtn" onClick={onResetZones}>Reset {view}</button>
          </div>
        </div>
      );
    }

    /* ===================== app ===================== */
    function App() {
      const [gender, setGender] = useState(() => load('dm_gender', 'male'));
      const [view, setView] = useState('front');
      const [mode, setMode] = useState('mark');   // 'mark' | 'zones'
      const [fillStyle, setFillStyle] = useState(() => load('dm_fill', 'stripes'));   // 'solid' | 'stripes'
      const [zonesStore, setZonesStore] = useState(() => load('dm_zones2', null) || seedZoneStore());
      const [dmgStore, setDmgStore] = useState(() => load('dm_zonedmg', { male: { front: {}, rear: {} }, female: { front: {}, rear: {} } }));
      const [selZoneId, setSelZoneId] = useState(null);
      const [showJson, setShowJson] = useState(false);

      useEffect(() => localStorage.setItem('dm_zones2', JSON.stringify(zonesStore)), [zonesStore]);
      useEffect(() => localStorage.setItem('dm_zonedmg', JSON.stringify(dmgStore)), [dmgStore]);
      useEffect(() => localStorage.setItem('dm_gender', JSON.stringify(gender)), [gender]);
      useEffect(() => localStorage.setItem('dm_fill', JSON.stringify(fillStyle)), [fillStyle]);
      // write the colour mapping onto the second (zone) layer so the layer is self-describing
      useEffect(() => localStorage.setItem('dm_layer', JSON.stringify({ layer: 'zones', dilate: DILATE, colors: LAYER_COLORS })), []);

      const zkey = keyFor(gender, view);
      const zones = zonesStore[zkey] || [];
      const zonesByView = { front: zonesStore[keyFor(gender, 'front')] || [], rear: zonesStore[keyFor(gender, 'rear')] || [] };
      const zoneDmg = dmgStore[gender] || { front: {}, rear: {} };
      const zoneDmgView = zoneDmg[view] || {};
      const zoneOf = useMemo(() => cellsToZoneMap(zones), [zones]);
      const ch = CHAR[gender];

      // keep a valid selected zone in Zones mode
      useEffect(() => {
        if (mode !== 'zones') return;
        if (!selZoneId || !zones.some(z => z.id === selZoneId)) setSelZoneId(zones[0] ? zones[0].id : null);
      }, [mode, gender, view, zones, selZoneId]);

      /* ---- damage (mark mode) ---- */
      const cycleZone = (zid) => setDmgStore(s => {
        const g = { ...(s[gender] || { front: {}, rear: {} }) };
        const vv = { ...(g[view] || {}) };
        const next = ((vv[zid] || 0) + 1) % 4;
        if (next) vv[zid] = next; else delete vv[zid];
        g[view] = vv;
        return { ...s, [gender]: g };
      });
      const clearDmgView = () => setDmgStore(s => ({ ...s, [gender]: { ...(s[gender] || {}), [view]: {} } }));
      const clearDmgAll = () => setDmgStore(s => ({ ...s, [gender]: { front: {}, rear: {} } }));

      /* ---- zones (zones mode) ---- */
      const toggleCell = (cell, action) => setZonesStore(s => {
        const list = (s[zkey] || []).map(z => ({ ...z, cells: z.cells.slice() }));
        // remove from any zone first
        list.forEach(z => { const i = z.cells.indexOf(cell); if (i >= 0) z.cells.splice(i, 1); });
        if (action === 'add' && selZoneId) {
          const z = list.find(z => z.id === selZoneId);
          if (z && !z.cells.includes(cell)) z.cells.push(cell);
        }
        return { ...s, [zkey]: list };
      });
      const addZone = () => setZonesStore(s => {
        const id = uid();
        const list = [...(s[zkey] || []), { id, label: 'New zone', cells: [] }];
        setSelZoneId(id);
        return { ...s, [zkey]: list };
      });
      const renameZone = (id, label) => setZonesStore(s => ({ ...s, [zkey]: (s[zkey] || []).map(z => z.id === id ? { ...z, label } : z) }));
      const deleteZone = (id) => {
        setZonesStore(s => ({ ...s, [zkey]: (s[zkey] || []).filter(z => z.id !== id) }));
        setDmgStore(s => {
          const g = s[gender] || {};
          const strip = (o) => { const n = { ...o }; delete n[id]; return n; };
          return { ...s, [gender]: { front: strip(g.front || {}), rear: strip(g.rear || {}) } };
        });
      };
      const clearZoneCells = (id) => setZonesStore(s => ({ ...s, [zkey]: (s[zkey] || []).map(z => z.id === id ? { ...z, cells: [] } : z) }));
      const resetZones = () => { if (confirm('Reset ' + gender + ' ' + view + ' zones to the committed set? This clears your in-app edits to them.')) setZonesStore(s => ({ ...s, [zkey]: seedZones(gender, view) })); };
      const nudge = (dr, dc) => setZonesStore(s => ({ ...s, [zkey]: nudgeZones(s[zkey] || [], gender, view, dr, dc) }));
      const copyFromOther = () => {
        const other = view === 'front' ? 'rear' : 'front';
        if (!confirm('Replace the ' + view + ' zones with the ' + other + ' set?')) return;
        setZonesStore(s => ({ ...s, [zkey]: cloneZones(s[keyFor(gender, other)] || []) }));
      };

      const g = useMemo(() => gradeOf(gender, zonesByView, zoneDmg), [gender, zonesStore, zoneDmg]);
      const fleetBest = bestOf(FLEET.map(f => f.grade));
      const beats = GRADES.indexOf(g.grade) > GRADES.indexOf(fleetBest);
      const totalZoneCells = zones.reduce((a, z) => a + z.cells.length, 0);

      let vc, vcb, vicon, vt, vd;
      if (beats) {
        vc = '#5d7d4d'; vcb = '#e7f0e0'; vicon = '★'; vt = 'Keep — promote to display';
        vd = `This copy (${g.grade}) outgrades every copy on hand. Make it the display copy and release the others from holding.`;
      } else if (GRADES.indexOf(g.grade) < GRADES.indexOf(fleetBest)) {
        vc = '#8f6a23'; vcb = '#f6ecca'; vicon = '↗'; vt = 'Release candidate';
        vd = `Copy C (${fleetBest}) already on display outgrades this one. This copy can move out of holding when you need the space or a buyer.`;
      } else {
        vc = '#56503f'; vcb = '#efe9dc'; vicon = '='; vt = 'Hold — ties the best';
        vd = `Even with the best copy on hand (${fleetBest}). Keep in holding as a backup until a higher grade comes in.`;
      }

      const covPct = (g.coverage * 100).toFixed(1);
      const maxCount = Math.max(1, ...g.counts.slice(1));
      const labelOf = (zid) => { const z = zones.find(z => z.id === zid); return z ? z.label : zid; };

      const json = JSON.stringify({
        figure: ch.name.toLowerCase(), gender, year: 1982, copy: ch.copy,
        grade: g.grade, demerit: g.score,
        layer: { name: 'zones', shared_views: false, colors: LAYER_COLORS },
        coverage: { marked_zones: g.markedZones, marked_cells: g.filledCells, active_cells: g.activeTotal, pct: +covPct },
        damage: Object.fromEntries(VIEWS.map(v => [v, Object.entries(zoneDmg[v] || {})
          .filter(([zid, lvl]) => lvl && (zonesByView[v] || []).some(z => z.id === zid))
          .map(([zid, lvl]) => ({ zone: (((zonesByView[v] || []).find(z => z.id === zid) || {}).label) || zid, severity: SEV[lvl].key }))])),
        holding: { fleet_best: fleetBest, verdict: beats ? 'promote' : GRADES.indexOf(g.grade) < GRADES.indexOf(fleetBest) ? 'release_candidate' : 'hold' },
      }, null, 2);

      return (
        <div className="page">
          <div className="page__head">
            <span className="page__title">Damage map</span>
            <span className="page__sub">Mark damage by zone · author zone presets · grade derived live</span>
          </div>
          <div className="ident">
            <span className="ftag">{ch.tag}</span>
            <span className="ident__name">{ch.name}</span>
            <span className="ident__meta">{ch.meta}</span>
            <span className="ident__copy">Grading <b>Copy {ch.copy}</b> · 3 on hand</span>
          </div>

          <div className="grid">
            {/* ---- figure column ---- */}
            <div className="figcol">
              <div className="figbar">
                <div className="seg">
                  <button className={view === 'front' ? 'on' : ''} onClick={() => setView('front')}>Front</button>
                  <button className={view === 'rear' ? 'on' : ''} onClick={() => setView('rear')}>Rear</button>
                </div>
                <div className="seg">
                  <button className={mode === 'mark' ? 'on' : ''} onClick={() => setMode('mark')}>Mark</button>
                  <button className={mode === 'zones' ? 'on' : ''} onClick={() => setMode('zones')}>Zones</button>
                </div>
                <div className="seg" title="How marked zones are filled">
                  <button className={fillStyle === 'solid' ? 'on' : ''} onClick={() => setFillStyle('solid')}>Solid</button>
                  <button className={fillStyle === 'stripes' ? 'on' : ''} onClick={() => setFillStyle('stripes')}>Stripes</button>
                </div>
                <div className="seg" title="Auto-selected per character from the database later">
                  <button className={gender === 'male' ? 'on' : ''} onClick={() => setGender('male')}>Male</button>
                  <button className={gender === 'female' ? 'on' : ''} onClick={() => setGender('female')}>Female</button>
                </div>
              </div>

              <FigureGrid mode={mode} gender={gender} view={view} zones={zones} zoneOf={zoneOf}
                          selZoneId={selZoneId} zoneDmgView={zoneDmgView} fillStyle={fillStyle}
                          onCycleZone={cycleZone} onToggleCell={toggleCell} />

              {mode === 'mark' ? (
                <div className="legend">
                  <span className="legend__lab">Key</span>
                  <span className="k"><i className="f1"></i>Cracked</span>
                  <span className="k"><i className="f2"></i>Damaged</span>
                  <span className="k"><i className="f3"></i>Broken</span>
                  <span className="legend__hint">{totalZoneCells === 0
                    ? <>No zones have cells yet — switch to <b>Zones</b> to paint cells into each preset, then come back here to mark damage.</>
                    : <>Click a zone to cycle <b>none → cracked → damaged → broken</b>. One click fills the whole zone.</>}</span>
                </div>
              ) : (
                <div className="legend">
                  <span className="legend__lab">Editing</span>
                  <span className="legend__hint">Pick a zone at right, then <b>click-drag cells</b> on the figure to add them. Click a cell already in the selected zone to remove it. A cell belongs to one zone — adding it moves it. <b>Front and rear are separate sets</b>, so edits here only affect the {view} view.</span>
                </div>
              )}

              <div className="toolrow">
                {mode === 'mark' ? (
                  <>
                    <button className="minibtn" onClick={clearDmgView}>Clear {view}</button>
                    <button className="minibtn" onClick={clearDmgAll}>Clear both views</button>
                    <div className="toolrow__sp"></div>
                    <span className="toolrow__hint">{g.markedZones} zone{g.markedZones === 1 ? '' : 's'} marked</span>
                  </>
                ) : (
                  <>
                    <span className="toolrow__hint"><b style={{ fontFamily: 'var(--font-display)' }}>{selZoneId ? labelOf(selZoneId) : '—'}</b> selected</span>
                    <div className="toolrow__sp"></div>
                    <span className="toolrow__hint">{totalZoneCells} of {g.activeTotal} cells assigned</span>
                  </>
                )}
              </div>
            </div>

            {/* ---- info column ---- */}
            <div className="infocol">
              {mode === 'zones' ? (
                <ZoneEditor zones={zones} view={view} selZoneId={selZoneId} onSelect={setSelZoneId}
                            onAdd={addZone} onRename={renameZone} onDelete={deleteZone}
                            onClearCells={clearZoneCells} onResetZones={resetZones}
                            onNudge={nudge} onCopyFrom={copyFromOther} />
              ) : (
                <>
                  <div className="panel">
                    <div className="panel__hd">Condition <em>derived from map</em></div>
                    <div className="cond">
                      <span className="cond__grade" style={{ background: GRADE_COLOR[g.grade] }}>{g.grade}</span>
                      <div className="cond__stats">
                        <span>demerit <b>{g.score}</b> · {g.markedZones} zone{g.markedZones === 1 ? '' : 's'} across both views</span>
                        <span>coverage <b>{covPct}%</b> · {g.filledCells}/{g.activeTotal} body cells</span>
                        {g.capped && <span className="cond__cap">ceiling capped at {g.cap} — broken part present</span>}
                      </div>
                    </div>
                  </div>

                  <div className="panel">
                    <div className="panel__hd">Severity breakdown <em>both views</em></div>
                    <div className="bd">
                      {[1, 2, 3].map(lvl => (
                        <div key={lvl} className="bd__row">
                          <span className="bd__sw" style={{ background: SEV[lvl].color }}></span>
                          <span className="bd__lab">{SEV[lvl].label}<small>+{SEV[lvl].weight}/zone</small></span>
                          <span className="bd__bar"><i className={'f' + lvl} style={{ width: (g.counts[lvl] / maxCount * 100) + '%' }}></i></span>
                          <span className="bd__n">{g.counts[lvl]}</span>
                        </div>
                      ))}
                      <div className="bd__cov">
                        <span>Total coverage</span>
                        <span><b>{covPct}%</b> · {g.filledCells}/{g.activeTotal}</span>
                      </div>
                    </div>
                  </div>

                  <div className="panel">
                    <div className="panel__hd">Holding decision <em>this copy vs. on hand</em></div>
                    <div className="verdict">
                      <div className="verdict__row">
                        <div className="vchip">
                          <div className="vchip__k">THIS COPY · {ch.copy}</div>
                          <div className="vchip__v" style={{ color: GRADE_COLOR[g.grade] }}>{g.grade} <small>overall</small></div>
                        </div>
                        <span className="varrow">vs</span>
                        <div className="vchip">
                          <div className="vchip__k">BEST ON HAND · C</div>
                          <div className="vchip__v" style={{ color: GRADE_COLOR[fleetBest] }}>{fleetBest} <small>display</small></div>
                        </div>
                      </div>
                      <div className="callout" style={{ '--c': vc, '--cb': vcb, color: vc }}>
                        <span className="callout__icon">{vicon}</span>
                        <div>
                          <div className="callout__t">{vt}</div>
                          <div className="callout__d">{vd}</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <CriteriaPanel />

                  <div className="actions">
                    <button className="btn" onClick={clearDmgAll}>Reset damage</button>
                    <button className="btn" onClick={() => setShowJson(true)}>View JSON</button>
                  </div>
                </>
              )}
            </div>
          </div>

          {showJson && (
            <div className="modal" onClick={() => setShowJson(false)}>
              <div className="modal__box" onClick={e => e.stopPropagation()}>
                <div className="modal__hd">condition.json<button onClick={() => setShowJson(false)}>✕</button></div>
                <pre className="modal__pre">{json}</pre>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
